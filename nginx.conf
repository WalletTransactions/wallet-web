# Минимальный конфиг — только статика (index.html/app.js/style.css/favicon.svg),
# без FastCGI/PHP/reverse-proxy: за всю динамику отвечают google-auth/wallet-api
# через wallet-gateway, а не этот сервис (см. README).
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    # gzip статики (по прямому запросу — "правь все пункты по нагрузке", тот
    # же мотив, что и у API-ответов wallet-report/wallet-api, см. их
    # CMakeLists.txt) — nginx:1.27-alpine уже собран с ngx_http_gzip_module,
    # достаточно включить директивой, никакого пересбора образа не нужно.
    # app.js/style.css — самые тяжёлые файлы статики (SPA целиком в одном
    # app.js) и как раз text/*, для которых сжатие даёт основной выигрыш.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 256;

    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # try_files .../index.html — на случай, если позже появятся
        # клиентские маршруты (сейчас у SPA их нет, вся навигация — через
        # fetch(), а не через путь в адресной строке): прямой заход на
        # несуществующий файл не 404-ит, а отдаёт index.html, и app.js сам
        # решает, что показать.
        # no-cache — не "не кэшировать", а "сверяться перед использованием":
        # браузер переспрашивает по ETag и получает 304, если файл тот же. Без
        # заголовка телефон держал app.js/style.css по эвристике и после
        # выката ещё долго показывал старую раскладку.
        location / {
            add_header Cache-Control "no-cache";
            try_files $uri $uri/ /index.html;
        }
    }
}
