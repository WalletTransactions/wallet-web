schema: spec-driven

context: |
  Все артефакты OpenSpec пишутся на русском.
  wallet-web — только статика: SPA без фреймворка и без сборки (site/app.js одним
  файлом в IIFE, ES5-стиль, style.css), отдаётся nginx. Своего HTTP API у сервиса нет.
  Все вызовы идут из браузера через wallet-gateway: /auth/* и /admin/* — google-auth,
  /api/reports/* — wallet-report, /api/* — wallet-api, /api/ai/* — wallet-ai.
  Аутентификация — httpOnly-cookie "session" от google-auth; JS токен не видит и не хранит.
  Новое поведение сервера (эндпоинт, поле, scope) делается в репозитории того сервиса;
  здесь — только клиент и ссылка на его контракт (openapi.yaml сервиса).
  LAN-only MVP: никаких внешних запросов (CDN, Google Fonts) — библиотеки только в site/vendor/.
  Дизайн-система Organic (токены в style.css); каждый экран работает и на телефоне
  (мобильный таббар, раскладка до ~700px).

rules:
  specs:
    - Не дублировать JSON-схемы других сервисов — ссылаться на путь и сервис
    - Каждое требование — с хотя бы одним сценарием WHEN/THEN
    - Тексты интерфейса, на которые опираются сценарии, приводить дословно
  design:
    - Явно указывать, нужна ли правка в другом сервисе (google-auth, wallet-api, wallet-report, wallet-ai, wallet-gateway) и какая
  tasks:
    - Автотестов у веба нет — каждая задача заканчивается ручной проверкой в браузере (десктоп и ширина телефона)
    - Изменение экрана сопровождается правкой README.md (раздел этого экрана)
